<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>OneApply - BRAINSTORM.md Preview</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background: #f5f5f5; }
  pre { background: #f5f5f5; padding: 16px; overflow-x: auto; border-radius: 4px; }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; }
  h1 { border-bottom: 2px solid #333; padding-bottom: 8px; }
  h2 { border-bottom: 1px solid #ddd; padding-bottom: 6px; margin-top: 32px; }
  hr { border: none; border-top: 1px solid #ddd; margin: 24px 0; }
</style>
</head>
<body>
<div id="content">Loading...</div>
<script>
fetch('/BRAINSTORM.md')
  .then(r => r.text())
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
  });
</script>
</body></html>
