services:
  postgres:
    image: postgres:16-alpine
    container_name: oneapply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oneapply
      POSTGRES_PASSWORD: oneapply
      POSTGRES_DB: oneapply
    ports:
      - "5432:5432"
    volumes:
      - oneapply-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneapply"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  oneapply-pgdata:
